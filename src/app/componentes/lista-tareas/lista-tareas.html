<h2>Gestor de Tareas del Curso</h2>
<p>
  Total: {{ tareasService.total() }} ·
  Pendientes: {{ tareasService.pendientes() }} ·
  Completadas: {{ tareasService.completadas() }}
</p>
<div class="contenedor-tareas">
  <!-- Aquí usamos el componente reutilizable 3 veces iterando el arreglo -->
   @for (t of tareasService.tareas(); track t.id) {
      <app-tarjeta-tarea [tarea] = "t" />
   } @empty {
    <p> no hay tareas todavia</p>
   }
</div>
