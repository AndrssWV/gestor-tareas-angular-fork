<div class="tarjeta" [class.completada]="tarea().estado">
  <input
    type="checkbox"
    (click)="$event.stopPropagation();"
    [checked]="tarea().estado"
    (change)="alternar.emit(tarea())"
  />

  @if (editando()) {
    <input
      #campo
      [value]="tarea().titulo"
      (click)="$event.stopPropagation();"
      (keyup.enter)="guardarEdicion(campo.value)"
      (keyup.escape)="editando.set(false)"
    />
    <button (click)="$event.stopPropagation(); guardarEdicion(campo.value)">Guardar</button>
    <button (click)="$event.stopPropagation(); editando.set(false)">Cancelar</button>
  } @else {
    <h3>{{ tarea().titulo }}</h3>
    <button (click)="$event.stopPropagation(); editando.set(true)">Editar</button>
    <button (click)="$event.stopPropagation(); eliminar.emit(tarea().id)">Eliminar</button>
  }
</div>
